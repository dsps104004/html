<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 NFC 多槽位門禁卡控制台</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 16px; }
    .container { max-width: 480px; margin: 0 auto; }
    h2 { text-align: center; color: #4fc3f7; margin-bottom: 16px; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; transition: 0.2s; }
    .btn-connect { background: #0288d1; color: white; }
    .btn-connect:hover { background: #0277bd; }
    .btn-action { background: #2e7d32; color: white; }
    .btn-warn { background: #d84315; color: white; }
    .btn-sub { background: #424242; color: white; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #2c2c2c; color: white; font-size: 15px; box-sizing: border-box; }
    #logBox { background: #000; color: #00e676; font-family: monospace; font-size: 13px; height: 180px; overflow-y: auto; padding: 10px; border-radius: 8px; white-space: pre-wrap; margin-top: 8px; }
    .status { text-align: center; font-size: 14px; margin-top: 8px; color: #ffb74d; }
  </style>
</head>
<body>
<div class="container">
  <h2>💳 智慧門禁卡控制台</h2>

  <div class="card">
    <button id="btnConnect" class="btn-connect" onclick="connectBLE()">連線至工程模式 (MultiCard_EngMode)</button>
    <div id="statusText" class="status">狀態：尚未連線 (請先用 nRF Connect 廣播 00001119 喚醒卡片)</div>
    <div class="row">
      <button class="btn-sub" onclick="sendCmd('INFO')">查詢所有槽位</button>
      <button class="btn-warn" onclick="sendCmd('EXIT')">儲存並休眠</button>
    </div>
  </div>

  <div class="card">
    <strong>1. 讀取與一鍵複製實體門禁卡</strong>
    <div class="row">
      <select id="cloneSlot">
        <option value="0">複製到 Slot 0</option>
        <option value="1">複製到 Slot 1</option>
        <option value="2">複製到 Slot 2</option>
        <option value="3">複製到 Slot 3</option>
      </select>
      <button class="btn-action" style="margin-top:0;" onclick="cloneCard()">啟動讀卡複製</button>
    </div>
    <button class="btn-sub" onclick="sendCmd('READ')">僅讀取外部卡片 UID (不覆寫)</button>
  </div>

  <div class="card">
    <strong>2. 手動修改槽位卡號與預設值</strong>
    <div class="row">
      <select id="editSlot">
        <option value="0">Slot 0</option>
        <option value="1">Slot 1</option>
        <option value="2">Slot 2</option>
        <option value="3">Slot 3</option>
      </select>
      <input type="text" id="uidInput" placeholder="8碼HEX (例: 08AABBCC)" maxlength="8">
    </div>
    <div class="row">
      <input type="text" id="nameInput" placeholder="自訂名稱 (例: 大門卡)" maxlength="20">
    </div>
    <div class="row">
      <button class="btn-action" onclick="saveSlot()">寫入卡號與名稱</button>
      <button class="btn-sub" onclick="setActiveSlot()">設為預設槽位</button>
    </div>
  </div>

  <div class="card">
    <strong>即時通訊紀錄</strong>
    <div id="logBox">等待連線...</div>
  </div>
</div>

<script>
  const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
  const RX_CHAR_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
  const TX_CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

  let bleDevice, rxChar, txChar;

  function log(msg) {
    const box = document.getElementById("logBox");
    box.textContent += "\n" + msg;
    box.scrollTop = box.scrollHeight;
  }

  async function connectBLE() {
    try {
      log("正在搜尋 MultiCard_EngMode...");
      bleDevice = await navigator.bluetooth.requestDevice({
        filters: [{ name: "MultiCard_EngMode" }],
        optionalServices: [SERVICE_UUID]
      });

      bleDevice.addEventListener("gattserverdisconnected", () => {
        document.getElementById("statusText").textContent = "狀態：已斷開連線";
        log("[系統] 藍牙已斷線");
      });

      const server = await bleDevice.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      rxChar = await service.getCharacteristic(RX_CHAR_UUID);
      txChar = await service.getCharacteristic(TX_CHAR_UUID);

      await txChar.startNotifications();
      txChar.addEventListener("characteristicvaluechanged", (e) => {
        const text = new TextDecoder().decode(e.target.value);
        log(text.trim());
      });

      document.getElementById("statusText").textContent = "狀態：已連線至工程模式";
      log("[成功] 已連線！正在讀取槽位資訊...");
      await sendCmd("INFO");
    } catch (err) {
      log("[錯誤] " + err.message);
    }
  }

  async function sendCmd(cmd) {
    if (!rxChar) return alert("請先連線藍牙！");
    const encoder = new TextEncoder();
    await rxChar.writeValue(encoder.encode(cmd + "\n"));
    log(">> " + cmd);
  }

  async function cloneCard() {
    const slot = document.getElementById("cloneSlot").value;
    await sendCmd("CLONE:" + slot);
  }

  async function saveSlot() {
    const slot = document.getElementById("editSlot").value;
    const uid = document.getElementById("uidInput").value.trim().toUpperCase();
    const name = document.getElementById("nameInput").value.trim();

    if (uid.length === 8 && /^[0-9A-F]+$/.test(uid)) {
      await sendCmd(`SET_UID:${slot}:${uid}`);
    } else if (uid.length > 0) {
      return alert("UID 必須為 8 碼十六進位字元 (0-9, A-F)");
    }

    if (name.length > 0) {
      setTimeout(() => sendCmd(`NAME:${slot}:${name}`), 150);
    }
  }

  async function setActiveSlot() {
    const slot = document.getElementById("editSlot").value;
    await sendCmd("USE:" + slot);
  }
</script>
</body>
</html>
