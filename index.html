<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC 動態智慧卡控制台</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #f5f5f5; margin: 0; padding: 20px; }
    .container { max-width: 480px; margin: 0 auto; }
    h2 { text-align: center; color: #4fc3f7; margin-bottom: 20px; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .status { font-size: 14px; color: #aaa; margin-bottom: 12px; text-align: center; }
    .status.connected { color: #81c784; font-weight: bold; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-connect { background: #0288d1; color: white; }
    .btn-disconnect { background: #d32f2f; color: white; display: none; }
    .btn-save { background: #388e3c; color: white; margin-top: 10px; }
    .slot-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
    .slot-label { font-size: 13px; color: #4fc3f7; width: 48px; flex-shrink: 0; }
    input[type="text"] { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #2c2c2c; color: #fff; font-size: 14px; }
    .btn-use { width: auto; padding: 10px 12px; background: #455a64; color: #fff; font-size: 13px; }
    .btn-use.active { background: #00acc1; color: #000; }
    .active-box { font-size: 14px; word-break: break-all; color: #ffd54f; margin-top: 8px; }
  </style>
</head>
<body>
<div class="container">
  <h2>NFC 智慧卡控制台</h2>

  <div class="card">
    <div id="statusText" class="status">尚未連線 (請先發送 SETUP 廣播並觸發卡片)</div>
    <button id="btnConnect" class="btn-connect" onclick="connectBLE()">連線至 NFC 智慧卡</button>
    <button id="btnDisconnect" class="btn-disconnect" onclick="disconnectBLE()">完成設定並斷線休眠</button>
    <div style="margin-top: 14px; font-size: 13px; color: #bbb;">當前卡片發射網址：</div>
    <div id="currentActiveUrl" class="active-box">--</div>
  </div>

  <div id="controlPanel" class="card" style="opacity: 0.4; pointer-events: none;">
    <div style="font-size: 15px; font-weight: bold; margin-bottom: 12px;">預設網址槽位 (支援廣播 SLOT1~5 快速切換)</div>
    <div id="slotsContainer"></div>
    <button class="btn-save" onclick="saveAllSlots()">儲存 5 組預設網址至卡片</button>
  </div>
</div>

<script>
  const SERVICE_UUID     = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
  const CHAR_ACTIVE_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
  const CHAR_SLOTS_UUID  = '1c95d5e3-d8f7-413a-bf3d-7a2e5d7be87e';

  let bleDevice = null;
  let activeChar = null;
  let slotsChar = null;
  let currentActive = "";

  // 初始化 5 個輸入框
  const slotsContainer = document.getElementById('slotsContainer');
  for (let i = 0; i < 5; i++) {
    slotsContainer.innerHTML += `
      <div class="slot-row">
        <span class="slot-label">SLOT ${i + 1}</span>
        <input type="text" id="slotInput${i}" placeholder="輸入網址 (如 example.com)">
        <button class="btn-use" id="btnUse${i}" onclick="activateSlot(${i})">立即啟用</button>
      </div>
    `;
  }

  async function connectBLE() {
    try {
      document.getElementById('statusText').innerText = '正在搜尋 NFC-SmartCard...';
      bleDevice = await navigator.bluetooth.requestDevice({
        filters: [{ name: 'NFC-SmartCard' }],
        optionalServices: [SERVICE_UUID]
      });

      bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
      const server = await bleDevice.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);

      activeChar = await service.getCharacteristic(CHAR_ACTIVE_UUID);
      slotsChar = await service.getCharacteristic(CHAR_SLOTS_UUID);

      // 讀取當前啟用網址
      const activeVal = await activeChar.readValue();
      currentActive = new TextDecoder().decode(activeVal);
      document.getElementById('currentActiveUrl').innerText = 'https://' + currentActive;

      // 讀取 5 組預設槽位
      const slotsVal = await slotsChar.readValue();
      const slotsList = new TextDecoder().decode(slotsVal).split('\n');
      for (let i = 0; i < 5; i++) {
        const val = slotsList[i] || '';
        document.getElementById(`slotInput${i}`).value = val;
        updateActiveButtonStyle(i, val === currentActive);
      }

      document.getElementById('statusText').innerText = '已連線至卡片 (斷線後卡片將自動休眠)';
      document.getElementById('statusText').classList.add('connected');
      document.getElementById('btnConnect').style.display = 'none';
      document.getElementById('btnDisconnect').style.display = 'block';
      document.getElementById('controlPanel').style.opacity = '1';
      document.getElementById('controlPanel').style.pointerEvents = 'auto';

    } catch (err) {
      document.getElementById('statusText').innerText = '連線取消或失敗：' + err.message;
    }
  }

  function disconnectBLE() {
    if (bleDevice && bleDevice.gatt.connected) {
      bleDevice.gatt.disconnect();
    }
  }

  function onDisconnected() {
    document.getElementById('statusText').innerText = '已斷線 (卡片已寫入並進入省電休眠)';
    document.getElementById('statusText').classList.remove('connected');
    document.getElementById('btnConnect').style.display = 'block';
    document.getElementById('btnDisconnect').style.display = 'none';
    document.getElementById('controlPanel').style.opacity = '0.4';
    document.getElementById('controlPanel').style.pointerEvents = 'none';
  }

  function updateActiveButtonStyle(index, isActive) {
    const btn = document.getElementById(`btnUse${index}`);
    if (isActive) {
      btn.classList.add('active');
      btn.innerText = '使用中';
    } else {
      btn.classList.remove('active');
      btn.innerText = '立即啟用';
    }
  }

  async function activateSlot(index) {
    let url = document.getElementById(`slotInput${index}`).value.trim();
    url = url.replace(/^https?:\/\//i, ''); // 自動去除前綴交由晶片壓縮編碼
    if (!url) return alert('請先輸入網址！');

    try {
      const encoder = new TextEncoder();
      await activeChar.writeValue(encoder.encode(url));
      currentActive = url;
      document.getElementById('currentActiveUrl').innerText = 'https://' + currentActive;
      for (let i = 0; i < 5; i++) {
        updateActiveButtonStyle(i, document.getElementById(`slotInput${i}`).value.trim().replace(/^https?:\/\//i, '') === currentActive);
      }
    } catch (err) {
      alert('寫入失敗：' + err.message);
    }
  }

  async function saveAllSlots() {
    let lines = [];
    for (let i = 0; i < 5; i++) {
      let val = document.getElementById(`slotInput${i}`).value.trim().replace(/^https?:\/\//i, '');
      lines.push(val || 'google.com');
    }
    try {
      const encoder = new TextEncoder();
      await slotsChar.writeValue(encoder.encode(lines.join('\n')));
      alert('5 組預設網址已成功存入卡片記憶體！');
    } catch (err) {
      alert('儲存失敗：' + err.message);
    }
  }
</script>
</body>
</html>
